name: Feature Request
description: Suggest an enhancement, new CLI verb, or optimization for rum
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for rum! Please share your ideas on how to make rum even faster, more compatible, or more capable.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is (e.g. "I often need to... but currently rum doesn't...").
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
      description: A clear and concise description of what you want to happen, including proposed CLI syntax or flags.
      placeholder: e.g. Add `rum provides <spec>` to query which package provides a capability or file path.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered, or how this is handled in `dnf` / `yum` / `uv`.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, performance benchmarks, or screenshots about the feature request here.
